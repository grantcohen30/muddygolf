<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuddyGolf</title>
<style>
:root {
  color-scheme: light;
  --surface-1:#fdfbf3; --page:#f1eee0;
  --ink-1:#14261b; --ink-2:#4a5a4e; --muted:#7d8a7f;
  --grid:#dcd9c4; --axis:#bfbca4; --border:rgba(20,38,27,0.14);
  --s1:#2f7d4a; --s2:#d98a2b; --s3:#2a78a8;
  --s1-wash:rgba(47,125,74,0.10); --s3-wash:rgba(42,120,168,0.12);
  --good:#006300; --warn:#a05a00; --bad:#a51d1d; --dim:#c3c2b7;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1:#13241a; --page:#0b160f;
    --ink-1:#f3f1e4; --ink-2:#b9c4b8; --muted:#7d8a7f;
    --grid:#24382b; --axis:#314a38; --border:rgba(243,241,228,0.12);
    --s1:#4fae6c; --s2:#e0953a; --s3:#4a9fd0;
    --s1-wash:rgba(79,174,108,0.14); --s3-wash:rgba(74,159,208,0.16);
    --good:#0ca30c; --warn:#e2a13a; --bad:#e25252; --dim:#52514e;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1:#13241a; --page:#0b160f;
  --ink-1:#f3f1e4; --ink-2:#b9c4b8; --muted:#7d8a7f;
  --grid:#24382b; --axis:#314a38; --border:rgba(243,241,228,0.12);
  --s1:#4fae6c; --s2:#e0953a; --s3:#4a9fd0;
  --s1-wash:rgba(79,174,108,0.14); --s3-wash:rgba(74,159,208,0.16);
  --good:#0ca30c; --warn:#e2a13a; --bad:#e25252; --dim:#52514e;
}
* { box-sizing:border-box; margin:0; }
body { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--page); color:var(--ink-1); -webkit-font-smoothing:antialiased; line-height:1.45; }
.wrap { max-width:1060px; margin:0 auto; padding:28px 16px 80px; }
header { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:6px; }
header h1 { font-size:22px; font-weight:650; letter-spacing:-0.01em; }
header .sub { color:var(--ink-2); font-size:14px; }
#themeBtn { margin-left:auto; background:none; border:1px solid var(--border); border-radius:8px; color:var(--ink-2); font:inherit; font-size:13px; padding:4px 10px; cursor:pointer; }
#themeBtn:hover { color:var(--ink-1); }

.tabs { display:flex; gap:2px; border-bottom:1px solid var(--grid); margin:14px 0 20px; overflow-x:auto; }
.tabs button { background:none; border:none; font:inherit; font-size:14px; padding:9px 14px; color:var(--ink-2); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
.tabs button:hover { color:var(--ink-1); }
.tabs button.on { color:var(--ink-1); font-weight:600; border-bottom-color:var(--s1); }
.tab { display:none; } .tab.on { display:block; }

/* ---- Golf theme: scorecard paper, fairway stripes, serif headings ---- */
:root { --fairway-a:#24663c; --fairway-b:#2b7346; --on-green:#f7f4e6; --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; }
header { background:repeating-linear-gradient(90deg,var(--fairway-a) 0 44px,var(--fairway-b) 44px 88px); color:var(--on-green); padding:18px 20px; border-radius:14px; margin-bottom:14px; box-shadow:0 1px 0 rgba(0,0,0,.08), inset 0 -3px 0 rgba(0,0,0,.14); align-items:center; }
header h1 { font-family:var(--serif); font-size:28px; font-weight:700; letter-spacing:.01em; display:flex; align-items:center; gap:10px; }
header h1 .flag { width:22px; height:26px; color:var(--on-green); flex:none; }
header .sub { color:rgba(247,244,230,.86); }
#themeBtn { color:var(--on-green); border-color:rgba(247,244,230,.45); } #themeBtn:hover { color:#fff; background:rgba(255,255,255,.12); }
.tabs { border-bottom:2px solid var(--grid); }
.tabs button.on { border-bottom:3px solid var(--s1); margin-bottom:-2px; color:var(--s1); }
.card { border-top:3px solid var(--s1); box-shadow:0 1px 2px rgba(20,38,27,.06); }
.card h3 { font-family:var(--serif); font-size:16px; letter-spacing:.01em; }
th { text-transform:uppercase; letter-spacing:.05em; font-size:11px; }
.rdsum b, .rd > summary .c, #rdCourse h2 { font-family:var(--serif); }
.rdsum div { border-top:3px solid var(--s2); }
.rd > summary .sc { font-family:var(--serif); font-size:19px; }
.sctbl { background:color-mix(in srgb, var(--s1) 4%, var(--surface-1)); border-radius:8px; }
.sctbl tr:first-child th { background:var(--fairway-a); color:var(--on-green); font-weight:600; }
.sctbl tr:first-child th:first-child { border-top-left-radius:8px; } .sctbl tr:first-child th:last-child { border-top-right-radius:8px; }
.sctbl td.tot { background:color-mix(in srgb, var(--s1) 9%, transparent); }
button.btn { border-radius:999px; }
tr.pick[title] { cursor:pointer; } tr.pick[title]:hover td { background:var(--s1-wash); } tr.sel td { background:color-mix(in srgb, var(--s1) 24%, transparent); } tr.sel td:first-child { box-shadow:inset 3px 0 0 var(--s1); font-weight:650; }
.hdetail { border-top-color:var(--s2); } button.btn:disabled { opacity:.4; cursor:default; }
.hbar { background:var(--s2); }

/* Rounds tab */
.rdsum { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:14px; }
.rdsum div { background:var(--surface-1); border:1px solid var(--border); border-radius:12px; padding:10px 14px; }
.rdsum b { display:block; font-size:22px; font-weight:650; letter-spacing:-0.01em; } .rdsum span { font-size:12.5px; color:var(--ink-2); }
.rd { padding:0; } .rd > summary { list-style:none; cursor:pointer; padding:14px 16px; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; } .rd > summary::-webkit-details-marker { display:none; }
.rd > summary .d { color:var(--ink-2); font-size:13px; min-width:84px; } .rd > summary .c { font-weight:600; } .rd > summary .sc { margin-left:auto; font-variant-numeric:tabular-nums; font-weight:650; }
.rd > summary .sc small { font-weight:400; color:var(--ink-2); margin-left:6px; }
.rd .body { padding:0 16px 14px; }
.sctbl { border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; margin:8px 0; width:100%; max-width:640px; }
.sctbl th, .sctbl td { text-align:center; padding:4px 6px; min-width:28px; } .sctbl th { color:var(--ink-2); font-weight:500; } .sctbl td.tot, .sctbl th.tot { font-weight:650; border-left:1px solid var(--grid); }
.sctbl tr.par td { color:var(--ink-2); }
.sctbl td i { font-style:normal; display:inline-block; min-width:22px; padding:1px 0; }
.sctbl td i.bd { border-radius:50%; border:1.5px solid var(--good); } .sctbl td i.bg { border:1.5px solid var(--warn); } .sctbl td i.db { border:1.5px solid var(--bad); outline:1.5px solid var(--bad); outline-offset:1.5px; } .sctbl td i.eg { border-radius:50%; border:1.5px solid var(--good); outline:1.5px solid var(--good); outline-offset:1.5px; }
#rdCourses tr.go { cursor:pointer; } #rdCourses tr.go:hover td { background:var(--s1-wash); } #rdCourses tr.go td:first-child { color:var(--s1); font-weight:600; }
.hbar { display:inline-block; height:8px; border-radius:4px; vertical-align:middle; background:var(--s2); } .hbar.neg { background:var(--good); }
.hl td { background:var(--s1-wash); }
.rdfacts { display:flex; flex-wrap:wrap; gap:6px 18px; font-size:12.5px; color:var(--ink-2); margin-top:6px; } .rdfacts b { color:var(--ink-1); font-weight:600; }


.card { background:var(--surface-1); border:1px solid var(--border); border-radius:12px; padding:16px 16px 12px; margin-bottom:14px; }
.card h3 { font-size:14px; font-weight:600; margin-bottom:2px; }
.card .desc { font-size:12.5px; color:var(--ink-2); margin-bottom:8px; }
.note { font-size:12.5px; color:var(--muted); margin:6px 0 8px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:760px){ .grid2 { grid-template-columns:1fr; } }

button.btn, label.btn { font:inherit; font-size:13px; padding:6px 13px; border-radius:8px; cursor:pointer; background:var(--surface-1); border:1px solid var(--border); color:var(--ink-1); display:inline-flex; align-items:center; gap:6px; }
button.btn:hover, label.btn:hover { border-color:var(--axis); }
button.btn.primary { background:var(--s1); border-color:var(--s1); color:#fff; font-weight:600; }
button.btn:disabled { opacity:.45; cursor:default; }
button.btn.dashed { border-style:dashed; color:var(--ink-2); }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.row label { font-size:13px; color:var(--ink-2); display:flex; align-items:center; gap:6px; }
select, input[type=text], input[type=password] { font:inherit; font-size:13px; color:var(--ink-1); background:var(--surface-1); border:1px solid var(--border); border-radius:8px; padding:5px 8px; }
input[type=file] { display:none; }
body.dragging::after { content:'Drop a swing video'; position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:600; background:var(--s1-wash); border:3px dashed var(--s1); color:var(--ink-1); }

/* ------- analyze ------- */
#dropzone { border:1px dashed var(--axis); border-radius:12px; padding:34px 16px; text-align:center; color:var(--ink-2); font-size:14px; cursor:pointer; }
#dropzone:hover { border-color:var(--s1); color:var(--ink-1); }
#stage { position:relative; background:#000; border-radius:10px; overflow:hidden; margin:10px 0 8px; display:none; }
#stage video { display:block; width:100%; max-height:62vh; margin:0 auto; background:#000; }
#stage canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
#stage.rot90 video { transform:none; }
.progress { height:6px; background:var(--grid); border-radius:3px; overflow:hidden; margin:8px 0; }
.progress i { display:block; height:100%; background:var(--s1); width:0; transition:width .15s; }
#status { font-size:13px; color:var(--ink-2); min-height:18px; }
.scrub { display:flex; align-items:center; gap:8px; margin:6px 0; }
.scrub input[type=range] { flex:1; accent-color:var(--s1); }
.scrub button { font:inherit; font-size:13px; background:var(--surface-1); border:1px solid var(--border); border-radius:8px; color:var(--ink-1); padding:3px 9px; cursor:pointer; }
.scrub .t { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:92px; text-align:right; }
.events { display:grid; grid-template-columns:repeat(8,1fr); gap:6px; margin:10px 0; }
@media (max-width:760px){ .events { grid-template-columns:repeat(4,1fr); } }
.ev { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface-1); cursor:pointer; padding:0; text-align:left; font:inherit; color:var(--ink-1); }
.ev img { display:block; width:100%; aspect-ratio:3/4; object-fit:cover; background:#111; }
.ev .lb { font-size:11px; padding:4px 6px; color:var(--ink-2); display:flex; justify-content:space-between; }
.ev .lb b { color:var(--ink-1); font-weight:600; }
.ev.on { border-color:var(--s1); box-shadow:0 0 0 2px var(--s1-wash); }
.ev.on .lb { color:var(--ink-1); }

.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:12px 0; }
.tile { background:var(--surface-1); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
.tile .lbl { font-size:12px; color:var(--ink-2); margin-bottom:2px; }
.tile .val { font-size:24px; font-weight:600; letter-spacing:-0.01em; font-variant-numeric:tabular-nums; }
.tile .val small { font-size:13px; color:var(--muted); font-weight:500; margin-left:2px; }
.tile .delta { font-size:12px; color:var(--ink-2); margin-top:2px; }
.tile.hero { grid-column:span 1; }
.tile .bar { height:4px; border-radius:2px; background:var(--grid); margin-top:8px; overflow:hidden; }
.tile .bar i { display:block; height:100%; background:var(--s1); }
select.what { border-left:4px solid transparent; }
.legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin:8px 2px 4px; font-size:12px; color:var(--ink-2); } .legend .lg { display:inline-flex; align-items:center; gap:6px; } .legend i { width:10px; height:10px; border-radius:3px; display:inline-block; }
input.where { font:inherit; font-size:13px; padding:4px 8px; border:1px solid var(--border); border-radius:6px; background:var(--surface-1); color:var(--ink-1); width:170px; } input.where:disabled { opacity:.4; }
.sc-good { color:var(--good); font-weight:600; } .sc-warn { color:var(--warn); font-weight:600; } .sc-bad { color:var(--bad); font-weight:600; }

table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { text-align:right; padding:7px 10px; border-bottom:1px solid var(--grid); white-space:nowrap; }
th:first-child, td:first-child, th.l, td.l { text-align:left; }
th { color:var(--ink-2); font-weight:600; font-size:12px; }
td { font-variant-numeric:tabular-nums; }
tbody tr:hover { background:var(--s1-wash); }
td.dim { color:var(--muted); }
.tblwrap { overflow-x:auto; }

#feedback { white-space:pre-wrap; font-size:14px; line-height:1.55; }
#feedback h4 { font-size:13.5px; margin:10px 0 2px; }
.pill { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; background:var(--s1-wash); color:var(--s1); font-weight:600; }

/* ------- drills ------- */
.drill { border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin:8px 0; display:grid; grid-template-columns:1fr 230px; gap:8px 18px; }
@media (max-width:760px){ .drill { grid-template-columns:1fr; } }
.drill h4 { font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.drill h4 .pill { background:var(--s3-wash); color:var(--s3); } .drill h4 .pill.club { background:var(--s1-wash); color:var(--s1); }
.drill .why { font-size:12.5px; color:var(--ink-2); margin:3px 0 6px; } .drill .why b { color:var(--ink-1); font-weight:600; font-variant-numeric:tabular-nums; }
.drill ol { margin:0 0 8px 18px; padding:0; font-size:13px; } .drill ol li { margin:2px 0; }
.drill .links { display:flex; flex-wrap:wrap; gap:6px; }
.drill .links a { font-size:12px; text-decoration:none; color:var(--ink-1); border:1px solid var(--border); border-radius:999px; padding:3px 10px; display:inline-flex; align-items:center; gap:5px; background:var(--surface-1); }
.drill .links a:hover { border-color:var(--s1); color:var(--s1); } .drill .links a.yt::before { content:'▶'; font-size:9px; color:#e0322b; } .drill .links a.more { color:var(--ink-2); border-style:dashed; }
.drill .track { align-self:start; border:1px solid var(--border); border-radius:10px; padding:10px 12px; background:var(--page); }
.drill .track .lbl { font-size:12px; color:var(--ink-2); margin-bottom:6px; display:flex; justify-content:space-between; } .drill .track .lbl b { color:var(--s3); font-weight:600; }
.drill .step { display:flex; align-items:center; gap:8px; margin:4px 0; font-size:13px; } .drill .step span.k { width:40px; color:var(--ink-2); }
.drill .step button { font:inherit; font-size:16px; line-height:1; width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--surface-1); color:var(--ink-1); cursor:pointer; } .drill .step button:hover { border-color:var(--s1); } .drill .step button:disabled { opacity:.4; cursor:default; }
.drill .step input { width:56px; text-align:center; font:inherit; font-size:14px; font-variant-numeric:tabular-nums; border:1px solid var(--border); border-radius:8px; padding:4px 6px; background:var(--surface-1); color:var(--ink-1); }
.drill .track .done { font-size:12px; color:var(--muted); margin-top:4px; min-height:16px; }
.drill.logged { border-color:var(--s3); box-shadow:0 0 0 2px var(--s3-wash); }
.heat { border-collapse:separate; border-spacing:2px; font-size:12px; } .heat td, .heat th { padding:0; border:0; white-space:nowrap; }
.heat th.l { text-align:left; padding-right:10px; font-weight:500; color:var(--ink-1); font-size:12.5px; } .heat th.l small { color:var(--muted); font-weight:400; margin-left:6px; }
.heat td.c { width:14px; height:14px; border-radius:3px; background:var(--grid); } .heat td.c.l1 { background:rgba(217,89,38,.35); } .heat td.c.l2 { background:rgba(217,89,38,.65); } .heat td.c.l3 { background:#d95926; } .heat td.c.today { outline:1px solid var(--ink-2); }
.heat th.m { text-align:left; color:var(--muted); font-weight:500; font-size:11px; height:16px; }
/* ------- charts ------- */
svg { display:block; width:100%; } svg text { font-family:inherit; }
#tooltip { position:fixed; display:none; z-index:30; pointer-events:none; background:var(--ink-1); color:var(--page); border-radius:8px; padding:8px 10px; font-size:12px; box-shadow:0 6px 20px rgba(0,0,0,.25); max-width:260px; }
#tooltip .tt-title { font-weight:600; margin-bottom:3px; }
#tooltip .tt-row { display:flex; align-items:center; gap:6px; font-variant-numeric:tabular-nums; }
#tooltip .tt-row i { width:9px; height:9px; border-radius:2px; display:inline-block; }
#tooltip .tt-row b { font-weight:600; min-width:40px; }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); margin:4px 0 6px; }
.legend .k { display:inline-flex; align-items:center; gap:6px; }
.legend .k i { width:14px; height:2px; display:inline-block; }
.legend .k i.sq { width:10px; height:10px; border-radius:3px; }

/* Compare: one event at a time, A | B blown up, filmstrip of pairs below (frames are stored at 150×200, so ~2.5× is the useful ceiling) */
.cmpbar { justify-content:space-between; margin-bottom:10px; }
.evpills { display:flex; gap:4px; flex-wrap:wrap; }
.evpills button { font:inherit; font-size:12.5px; padding:5px 10px; border-radius:999px; border:1px solid var(--border); background:var(--surface-1); color:var(--ink-2); cursor:pointer; }
.evpills button.on { background:var(--s1); border-color:var(--s1); color:#fff; font-weight:600; }
.cmpstage { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.cmpstage figure { margin:0; text-align:center; }
.cmpstage img { width:100%; max-height:560px; aspect-ratio:3/4; object-fit:contain; border-radius:12px; background:#111; display:block; }
.cmpstage figcaption { font-size:13px; color:var(--ink-2); margin-top:6px; }
.cmpstage figcaption b { color:var(--ink-1); }
.cmpstrip { display:grid; grid-template-columns:repeat(8,1fr); gap:4px; margin-top:12px; }
.cmpstrip .pair { cursor:pointer; border-radius:8px; padding:3px; border:2px solid transparent; }
.cmpstrip .pair.on { border-color:var(--s1); }
.cmpstrip .pair img { width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:5px; background:#111; display:block; }
.cmpstrip .pair img + img { margin-top:3px; }
.cmpstrip .cmplbl { margin-top:3px; }
@media (max-width:760px){ .cmpstage { gap:8px; } .cmpstrip { grid-template-columns:repeat(4,1fr); } }
.cmpgrid { display:grid; grid-template-columns:repeat(8,1fr); gap:4px; }
@media (max-width:760px){ .cmpgrid { grid-template-columns:repeat(4,1fr); } }
.cmpgrid img { width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:6px; background:#111; }
.cmplbl { font-size:11px; color:var(--muted); text-align:center; }
footer { margin-top:30px; font-size:12px; color:var(--muted); }

.tabs { display:none; } #tab-rounds { display:block; }
.banner { font-family:var(--serif); font-weight:800; text-transform:uppercase; font-size:clamp(24px,7.2vw,84px); line-height:1; letter-spacing:.02em; text-align:center; color:var(--ink-1); padding:22px 8px 20px; margin:6px 0 18px; border-block:3px solid var(--s2); overflow-wrap:anywhere; text-wrap:balance; }
#updated { font-size:12.5px; color:var(--ink-2); margin:-6px 0 12px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1><svg class="flag" viewBox="0 0 28 32" aria-hidden="true"><path d="M7 3v26" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M7 4l15 6-15 7z" fill="#d98a2b"/><ellipse cx="7" cy="29.5" rx="6" ry="2" fill="currentColor" opacity=".35"/></svg><span>MuddyGolf</span></h1>
  <span class="sub">Jeff&#x27;s rounds, hole by hole</span>
  <button id="themeBtn" type="button">Theme</button>
</header>
<div class="banner" role="heading" aria-level="2">SWING HARDERRRRR</div>
<div id="updated" hidden></div>
<section id="tab-rounds" class="tab on">
  <div id="rdCourse" hidden></div>
  <div id="rdMain">
    <div id="rdSummary" class="rdsum"></div>
    <div class="card"><h3>Courses</h3><div class="desc">Rounds grouped by course. Tap a course for a hole-by-hole breakdown. 18-hole rounds are scaled to 9 for the per-9 numbers.</div><div class="tblwrap"><table id="rdCourses"></table></div></div>
    <div id="rdList"></div>
  </div>
</section>
</div>
<script>
const $ = id => document.getElementById(id);

    top.append(hh, nav('\u2039 Prev', h.i - 1), nav('Next \u203a', h.i + 1), close); dc.appendChild(top);
    const strip = el('div', 'rdsum'); strip.style.marginBottom = '10px';
    const last3 = plays.slice(0, 3), l3v = last3.filter(x => x.p != null).map(x => x.s - x.p), l3 = l3v.length ? mean(l3v) : null;
    [[bestS, `best (${bestDates.length > 1 ? bestDates.length + ' times, latest ' + bestDates[0] : bestDates[0]})`], [h.avg.toFixed(1), h.vs != null ? `average (${f1(h.vs)} vs par)` : 'average'], [worstS, 'worst'], [l3 != null && plays.length > 1 ? f1(l3) : '\u2013', `last ${last3.length} avg vs par`]]
      .forEach(([v, l]) => { const d = el('div'); d.append(el('b', '', v), el('span', '', l)); strip.appendChild(d); }); dc.appendChild(strip);
    const tw = el('div', 'tblwrap'), pt = el('table'); tw.appendChild(pt); dc.appendChild(tw);
    const ph = el('tr'); ['Date', 'Score', 'vs par', '', 'Result'].forEach((x, i) => ph.appendChild(el('th', i === 0 ? 'l' : i === 4 ? 'l' : '', x))); pt.appendChild(ph);
    const res = d => d <= -2 ? 'Eagle' : d === -1 ? 'Birdie' : d === 0 ? 'Par' : d === 1 ? 'Bogey' : d === 2 ? 'Double' : d === 3 ? 'Triple' : d === 4 ? 'Quad' : '+' + d;
    plays.forEach(x => { const d = x.p == null ? null : x.s - x.p, tr = el('tr', x.s === bestS ? 'hl' : '');
      [new Date(x.date + 'T12:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }), x.s, d == null ? '' : sgn(d)].forEach((v, i) => tr.appendChild(el('td', i === 0 ? 'l' : '', v)));
      const bt = el('td', 'l'); if (d != null) { const b = el('span', 'hbar' + (d <= 0 ? ' neg' : '')); b.style.width = Math.round(Math.max(0, d) / Math.max(1, worstS - h.par) * 90 + (d <= 0 ? 6 : 0)) + 'px'; bt.appendChild(b); } tr.appendChild(bt);
      tr.appendChild(el('td', 'l', (d == null ? '' : res(d)) + (x.s === bestS ? ' \u2605 best' : ''))); pt.appendChild(tr); });
    box.appendChild(dc);
  }
  box.appendChild(card);
  const rc = el('div', 'card'); rc.append(el('h3', '', 'Rounds here')); const rt = el('table'); rc.appendChild(rt);
  const h2 = el('tr'); ['Date', 'Score', 'To par'].forEach((x, i) => h2.appendChild(el('th', i === 0 ? 'l' : '', x))); rt.appendChild(h2);
  [...rs].reverse().forEach(r => { const tr = el('tr'); [r.date, r.score, sgn(r.toPar)].forEach((v, i) => tr.appendChild(el('td', i === 0 ? 'l' : '', v))); rt.appendChild(tr); });
  box.appendChild(rc);
}

renderRounds();
async function refresh() {   // live pars + live rounds; any failure keeps what is already showing
  try { const r = await fetch('courses.json', { cache: 'no-cache' }); if (r.ok) COURSES = await r.json(); } catch (_) {}
  let when = null;
  if (DATA_URL) try { const r = await fetch(DATA_URL); const d = await r.json(); if (Array.isArray(d.rounds)) { ROUNDS = d.rounds; when = d.updated; } } catch (_) {}
  STATS = buildStats(ROUNDS, COURSES); renderRounds();
  if (when) { const u = $('updated'); u.hidden = false; u.textContent = 'Updated ' + new Date(when).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }
}
refresh();
</script>
